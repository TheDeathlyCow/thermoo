plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "2.3.10"
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.nucleoid.xyz" }
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    api("dev.yumi.commons:yumi-commons:${project.yumi_version}")
    api("dev.yumi.commons:yumi-commons-core:${project.yumi_version}")
    api("dev.yumi.commons:yumi-commons-collections:${project.yumi_version}")
    api("dev.yumi.commons:yumi-commons-event:${project.yumi_version}")

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    include("dev.yumi.commons:yumi-commons:${project.yumi_version}")
    include("dev.yumi.commons:yumi-commons-core:${project.yumi_version}")
    include("dev.yumi.commons:yumi-commons-collections:${project.yumi_version}")
    include("dev.yumi.commons:yumi-commons-event:${project.yumi_version}")

    compileOnly "eu.pb4:polymer-core:${project.polymer_version}"
    compileOnly "eu.pb4:polymer-networking:${project.polymer_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:3.+"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "thermoo-test"
        enableGameTests = true
        eula = true
        enableClientGameTests = true
    }

    configureDataGeneration() {
        client = true
        createSourceSet = true
        modId = "thermoo-datagen"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/thermoo.accesswidener")

    interfaceInjection {
        enableDependencyInterfaceInjection = true
    }

    runs {
        testmodClient {
            client()
            ideConfigGenerated project.rootProject == project
            name = "Testmod Client"
            source sourceSets.gametest
        }
        testmodServer {
            server()
            ideConfigGenerated project.rootProject == project
            name = "Testmod Server"
            source sourceSets.gametest
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 26.1 upwards uses Java 25.
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
    withJavadocJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
    jvmToolchain(25)
}

jar {
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

test {
    useJUnitPlatform()
}

publishMods {
    changelog = file("changelogs/${mod_version}.md").text
    type = BETA

    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    additionalFiles.from(javadocJar.archiveFile)
    displayName = "Thermoo ${mod_version}"

    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "846544"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        javaVersions.add(JavaVersion.VERSION_25)

        clientRequired = false
        serverRequired = true

        requires("fabric-api", "cardinal-components-api")

        optional("thermoo-patches", "polymer")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "9TbXlAut"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        requires("fabric-api", "cardinal-components-api")

        optional("thermoo-patches", "polymer")
    }

    github {
        repository = "TheDeathlyCow/thermoo"
        accessToken = providers.environmentVariable("RELEASE_GITHUB_TOKEN")
        commitish = "26.1.x"
        tagName = "v${mod_version}"

        displayName = "[${minecraft_version}] Thermoo ${mod_version}"
    }
}